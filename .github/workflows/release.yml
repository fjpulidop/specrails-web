name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'Force deploy to Hostinger (skips release-please)'
        required: false
        default: 'true'
        type: boolean
      clean_slate:
        description: 'Force full re-upload (deletes server state file, then uploads all files)'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - uses: googleapis/release-please-action@16a9c90856f42705d54a6fda1823352bdc62cf38  # v4.4.0
        id: release
        with:
          release-type: node
          token: ${{ secrets.GITHUB_TOKEN }}

      - if: ${{ steps.release.outputs.release_created || github.event_name == 'workflow_dispatch' }}
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f  # v6.3.0
        with:
          node-version: 20
          cache: npm

      - if: ${{ steps.release.outputs.release_created || github.event_name == 'workflow_dispatch' }}
        run: |
          npm ci
          npm run build

      - if: ${{ steps.release.outputs.release_created || github.event_name == 'workflow_dispatch' }}
        name: Show build output
        run: |
          echo "=== dist/ contents ==="
          find dist/ -type f | sort
          echo "=== Total files: $(find dist/ -type f | wc -l) ==="

      # Validate FTP credentials before attempting deployment.
      # FTP_SERVER must be a plain hostname (e.g. ftp.yourdomain.com) — no protocol prefix.
      # Find the correct value in Hostinger hPanel > FTP Accounts.
      - if: ${{ steps.release.outputs.release_created || github.event_name == 'workflow_dispatch' }}
        name: Validate FTP configuration
        run: |
          if [ -z "$FTP_SERVER" ]; then
            echo "::error::FTP_SERVER secret is not configured. Add it under Settings > Secrets and variables > Actions."
            echo "::error::Expected format: ftp.yourdomain.com (plain hostname, no ftp:// prefix)"
            exit 1
          fi
          echo "Resolving FTP server host: $FTP_SERVER"
          if echo "$FTP_SERVER" | grep -qE '^[0-9]{1,3}(\.[0-9]{1,3}){3}$'; then
            # A bare IPv4 needs no DNS resolution. Hostinger hands out an IP in
            # hPanel that often has NO reverse-DNS (PTR) record, so `nslookup`
            # would wrongly reject a perfectly valid server — skip it for IPs.
            echo "FTP_SERVER is an IP address — skipping DNS resolution."
          elif ! nslookup "$FTP_SERVER" > /dev/null 2>&1; then
            echo "::error::Cannot resolve hostname '$FTP_SERVER'."
            echo "::error::Check that FTP_SERVER is set to the plain host provided by Hostinger (hPanel > FTP Accounts)."
            echo "::error::Common mistake: including the 'ftp://' prefix. The secret should contain only the host/IP."
            exit 1
          else
            echo "FTP server hostname resolved successfully."
          fi
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}

      # When clean_slate=true (manual dispatch) or first deploy, we do a full re-upload.
      # This fixes the common issue where the sync-state file on the server is stale,
      # causing the action to report "nothing to deploy" when files are actually missing.
      - if: ${{ (steps.release.outputs.release_created || github.event_name == 'workflow_dispatch') && github.event.inputs.clean_slate == 'true' }}
        name: Deploy to Hostinger (clean slate — full re-upload)
        uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287  # v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          security: loose
          local-dir: ./dist/
          server-dir: ${{ vars.FTP_SERVER_DIR || 'domains/specrails.dev/public_html/' }}
          dangerous-clean-slate: true
          log-level: verbose

      - if: ${{ (steps.release.outputs.release_created || github.event_name == 'workflow_dispatch') && github.event.inputs.clean_slate != 'true' }}
        name: Deploy to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287  # v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          security: loose
          local-dir: ./dist/
          server-dir: ${{ vars.FTP_SERVER_DIR || 'domains/specrails.dev/public_html/' }}

      - if: ${{ steps.release.outputs.release_created || github.event_name == 'workflow_dispatch' }}
        name: Smoke test — verify site is live
        run: |
          SITE_URL="${{ vars.SITE_URL || 'https://specrails.dev' }}"
          echo "Running smoke test against $SITE_URL"
          for i in 1 2 3; do
            STATUS=$(curl -o /tmp/smoke_body.html -s -w "%{http_code}" --max-time 15 "$SITE_URL")
            if [ "$STATUS" -eq 200 ]; then
              break
            fi
            echo "Attempt $i: got HTTP $STATUS, retrying in 10s..."
            sleep 10
          done
          if [ "$STATUS" -ne 200 ]; then
            echo "::error::Smoke test failed — $SITE_URL returned HTTP $STATUS"
            exit 1
          fi
          echo "HTTP 200 OK"
          if ! grep -qi '<title>' /tmp/smoke_body.html; then
            echo "::error::Smoke test failed — <title> tag not found in response"
            exit 1
          fi
          echo "Title tag present"
          if ! grep -qi '<meta' /tmp/smoke_body.html; then
            echo "::error::Smoke test failed — no <meta> tags found in response"
            exit 1
          fi
          echo "Meta tags present"
          echo "Smoke test passed."
