name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: googleapis/release-please-action@v4
        id: release
        with:
          release-type: node
          token: ${{ secrets.GITHUB_TOKEN }}

      - if: ${{ steps.release.outputs.release_created }}
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - if: ${{ steps.release.outputs.release_created }}
        run: |
          npm ci
          npm run build
        # TODO: add deployment step once Hostinger/hosting CI integration is configured
        # Options: rsync via SSH, Vercel CLI, or webhook trigger
