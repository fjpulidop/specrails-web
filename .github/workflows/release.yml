name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'Force deploy to Hostinger (skips release-please)'
        required: false
        default: 'true'
        type: boolean
      clean_slate:
        description: 'Force full re-upload (deletes server state file, then uploads all files)'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: googleapis/release-please-action@v4
        id: release
        with:
          release-type: node
          token: ${{ secrets.GITHUB_TOKEN }}

      - if: ${{ steps.release.outputs.release_created || github.event_name == 'workflow_dispatch' }}
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - if: ${{ steps.release.outputs.release_created || github.event_name == 'workflow_dispatch' }}
        run: |
          npm ci
          npm run build

      - if: ${{ steps.release.outputs.release_created || github.event_name == 'workflow_dispatch' }}
        name: Show build output
        run: |
          echo "=== dist/ contents ==="
          find dist/ -type f | sort
          echo "=== Total files: $(find dist/ -type f | wc -l) ==="

      # Validate FTP credentials before attempting deployment.
      # FTP_SERVER must be a plain hostname or IP — no protocol prefix, no trailing spaces.
      # Find the correct value in Hostinger hPanel > FTP Accounts.
      # Outputs ftp_server with all whitespace stripped to guard against copy-paste issues.
      - if: ${{ steps.release.outputs.release_created || github.event_name == 'workflow_dispatch' }}
        name: Validate FTP configuration
        id: ftp-validate
        run: |
          FTP_SERVER_TRIMMED=$(echo "$FTP_SERVER" | tr -d '[:space:]')
          if [ -z "$FTP_SERVER_TRIMMED" ]; then
            echo "::error::FTP_SERVER secret is not configured. Add it under Settings > Secrets and variables > Actions."
            echo "::error::Expected format: ftp.yourdomain.com or a plain hostname/IP — no ftp:// prefix, no spaces"
            exit 1
          fi
          echo "Resolving FTP server: $FTP_SERVER_TRIMMED"
          if ! nslookup "$FTP_SERVER_TRIMMED" > /dev/null 2>&1; then
            echo "::error::Cannot resolve '$FTP_SERVER_TRIMMED'."
            echo "::error::Check FTP_SERVER in repository secrets. Must be a plain hostname or IP — no protocol prefix, no trailing spaces."
            exit 1
          fi
          echo "FTP server resolved successfully."
          echo "ftp_server=$FTP_SERVER_TRIMMED" >> "$GITHUB_OUTPUT"
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}

      # When clean_slate=true (manual dispatch) or first deploy, we do a full re-upload.
      # This fixes the common issue where the sync-state file on the server is stale,
      # causing the action to report "nothing to deploy" when files are actually missing.
      - if: ${{ (steps.release.outputs.release_created || github.event_name == 'workflow_dispatch') && github.event.inputs.clean_slate == 'true' }}
        name: Deploy to Hostinger (clean slate — full re-upload)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ steps.ftp-validate.outputs.ftp_server }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ${{ vars.FTP_SERVER_DIR || 'public_html/' }}
          dangerous-clean-slate: true
          log-level: verbose

      - if: ${{ (steps.release.outputs.release_created || github.event_name == 'workflow_dispatch') && github.event.inputs.clean_slate != 'true' }}
        name: Deploy to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ steps.ftp-validate.outputs.ftp_server }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ${{ vars.FTP_SERVER_DIR || 'public_html/' }}
          log-level: verbose
