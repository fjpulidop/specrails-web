name: Update Docs from specrails-core

on:
  repository_dispatch:
    types: [specrails-core-released]

permissions:
  contents: write
  pull-requests: write

jobs:
  update-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f  # v6.3.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Update specrails-core
        run: npm update specrails-core

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Create pull request for dependency update
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ github.event.client_payload.core_version }}"
          BRANCH="chore/update-specrails-core-${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add package.json package-lock.json
          git commit -m "chore(deps): update specrails-core to ${VERSION}"
          git push -u origin "$BRANCH"
          gh pr create \
            --title "chore(deps): update specrails-core to ${VERSION}" \
            --body "Automated dependency update triggered by specrails-core release ${VERSION}. Merging will trigger deployment via the Release workflow." \
            --base main \
            --head "$BRANCH"
