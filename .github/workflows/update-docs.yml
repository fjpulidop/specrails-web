name: Update Docs from Package Release

on:
  repository_dispatch:
    types:
      - specrails-core-released
      - specrails-hub-released
      - specrails-mcp-released

permissions:
  contents: write
  pull-requests: write

jobs:
  update-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f  # v6.3.0
        with:
          node-version: 20
          cache: npm

      - name: Resolve package metadata from dispatch type
        id: meta
        run: |
          case "${{ github.event.action }}" in
            specrails-core-released)
              echo "package=specrails-core" >> $GITHUB_OUTPUT
              echo "version=${{ github.event.client_payload.core_version }}" >> $GITHUB_OUTPUT
              ;;
            specrails-hub-released)
              echo "package=specrails-hub" >> $GITHUB_OUTPUT
              echo "version=${{ github.event.client_payload.hub_version }}" >> $GITHUB_OUTPUT
              ;;
            specrails-mcp-released)
              echo "package=specrails-mcp" >> $GITHUB_OUTPUT
              echo "version=${{ github.event.client_payload.mcp_version }}" >> $GITHUB_OUTPUT
              ;;
            *)
              echo "Unknown dispatch type: ${{ github.event.action }}"
              exit 1
              ;;
          esac

      - name: Install dependencies
        run: npm ci

      - name: Update ${{ steps.meta.outputs.package }}
        run: npm update ${{ steps.meta.outputs.package }}

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Create pull request for dependency update
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PACKAGE="${{ steps.meta.outputs.package }}"
          VERSION="${{ steps.meta.outputs.version }}"
          BRANCH="chore/update-${PACKAGE}-${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add package.json package-lock.json
          git commit -m "chore(deps): update ${PACKAGE} to ${VERSION}"
          git push -u origin "$BRANCH"
          gh pr create \
            --title "chore(deps): update ${PACKAGE} to ${VERSION}" \
            --body "Automated dependency update triggered by ${PACKAGE} release ${VERSION}. Merging will trigger deployment via the Release workflow." \
            --base main \
            --head "$BRANCH"
