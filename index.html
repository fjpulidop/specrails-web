<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Apply the saved or system theme before first paint to avoid a flash. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('sr-theme');
          var theme = (stored === 'light' || stored === 'dark')
            ? stored
            : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.dataset.theme = theme;
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>

    <!-- Fonts: preconnect + non-blocking stylesheet (no render-blocking @import) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      />
    </noscript>

    <title>Specrails — Start with a mission. Ship with a plan.</title>
    <meta name="description" content="Specrails connects agent conversations, shared specs and implementation loops across your repositories. Start in Mission Control, organize with Board and review the result. Open source for macOS and Windows." />
    <meta name="author" content="specrails" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://specrails.dev/" />

    <meta property="og:title" content="Specrails — Start with a mission. Ship with a plan." />
    <meta property="og:description" content="A mission-first workspace for software. Connect your repositories, create specs, run loops and review changes with your preferred coding agent." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://specrails.dev/" />
    <meta property="og:image" content="https://specrails.dev/og-image.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Specrails — Start with a mission. Ship with a plan." />
    <meta name="twitter:description" content="Agent conversations, shared specs, implementation loops and review in one local workspace." />
    <meta name="twitter:image" content="https://specrails.dev/og-image.png" />

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "specrails",
      "description": "A local workspace for agent missions, shared specifications, multi-repository implementation loops and code review.",
      "applicationCategory": "DeveloperApplication",
      "operatingSystem": "macOS, Windows",
      "url": "https://specrails.dev",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "creator": {
        "@type": "Organization",
        "name": "specrails"
      }
    }
    </script>

    <!-- Plausible Analytics -->
    <script defer data-domain="specrails.dev" src="https://plausible.io/js/script.js"></script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
