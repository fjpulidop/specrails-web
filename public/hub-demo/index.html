    <meta charset="UTF-8" />

    <title>specrails — Hub Demo</title>
    <script>
      // Hide chat panel, status bar, and toasts in demo mode.
      addEventListener('load', () => setTimeout(() => {
        // Chat panel: the narrow sidebar strip next to <main>
        const main = document.querySelector('main');
        if (main && main.nextElementSibling) main.nextElementSibling.style.display = 'none';
        // Status bar footer
        document.querySelectorAll('footer').forEach(el => el.style.display = 'none');
        // Toast container
        document.querySelectorAll('[data-sonner-toaster]').forEach(el => el.style.display = 'none');
        // CLI badge ("Claude Code v1.0.0")
        document.querySelectorAll('span').forEach(el => {
          if (el.textContent && el.textContent.includes('Claude Code')) el.style.display = 'none';
        });
        // "/ manager" text next to logo
        document.querySelectorAll('span').forEach(el => {
          if (el.textContent && el.textContent.trim() === '/ manager') el.style.display = 'none';
        });
      }, 500));
    </script>
