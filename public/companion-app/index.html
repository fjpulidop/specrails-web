<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/companion-app/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Control your Specrails Desktop AI pipeline from your phone — paired peer-to-peer, no server.">
  <meta name="theme-color" content="#07070E">

  <!-- Brand-dark background everywhere so the PWA never flashes white — during
       load, in the safe areas, and in the iOS status-bar region under the
       translucent bar. -->
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background-color: #07070E; }
    #loading {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      background-color: #07070E;
    }
    #loading img { width: 88px; height: 88px; border-radius: 20px; }
  </style>

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Specrails">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Specrails Companion</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!-- Dark splash shown while Flutter boots (its canvas covers this once it
       renders) — avoids the white loading flash on iOS standalone. -->
  <div id="loading"><img src="icons/Icon-192.png" alt="Specrails"></div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
